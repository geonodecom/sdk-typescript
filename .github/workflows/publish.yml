name: Publish

# Manual only. npm accepts the upload once this repository is the package's
# trusted publisher (workflow publish.yml, environment npm).
on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Where to publish after validation
        required: true
        default: none
        type: choice
        options:
          - none
          - npm

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check version, release notes and repository URL
        run: |
          node <<'NODE'
          const fs = require("fs")

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8")
          const escaped = pkg.version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
          const heading = changelog.match(new RegExp(`^## \\[${escaped}\\](?: - .+)?$`, "m"))
          if (!heading) throw new Error(`CHANGELOG.md needs a heading for ${pkg.version}`)

          const rest = changelog.slice(heading.index + heading[0].length)
          const next = rest.search(/^## \[/m)
          if (!(next === -1 ? rest : rest.slice(0, next)).trim()) {
            throw new Error(`CHANGELOG.md needs release notes under ${pkg.version}`)
          }

          // npm trusted publishing only accepts uploads from the repository named here.
          if (pkg.repository?.url !== "https://github.com/geonodecom/sdk-typescript.git") {
            throw new Error("package.json repository.url must be https://github.com/geonodecom/sdk-typescript.git")
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run Biome checks
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

  npm-publish:
    runs-on: ubuntu-latest
    needs: validate-build
    if: inputs.publish_target == 'npm'
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@geonode_scraper/scraper-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
